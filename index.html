<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIDDIK OFFICIAL ORIGINAL AI HACK</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Montserrat:wght@700;800;900&family=Hind+Siliguri:wght@600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', 'Hind Siliguri', sans-serif;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #05050a;
            color: #fff;
        }

        /* ফুল স্ক্রিন মেইন অ্যাপ শেল */
        .app-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* ব্যাকগ্রাউন্ড গেম ফ্রেম (ফুল স্ক্রিন) */
        .game-frame {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* ভিআইপি পাসওয়ার্ড ওভারলে (ফুল স্ক্রিন) */
        .auth-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, #130b2e 0%, #030307 100%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .auth-card {
            width: 100%;
            max-width: 360px;
            background: rgba(15, 12, 28, 0.95);
            border: 2px solid #ffd700;
            border-radius: 20px;
            padding: 28px 20px;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.3);
        }

        .auth-input {
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            border: 2px solid #ffd700;
            background: #000;
            color: #ffd700;
            text-align: center;
            font-size: 16px;
            font-weight: 800;
            outline: none;
            margin: 15px 0;
        }

        /* ফুল স্ক্রিন কাস্টমাইজড হ্যাক ইন্টারফেস ওভারলে */
        .hack-overlay-ui {
            position: absolute;
            inset: 0;
            z-index: 10;
            pointer-events: none; /* যাতে পেছনের গেমে ক্লিক করা যায় */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px;
        }

        /* টপ হেডার বার */
        .top-custom-bar {
            pointer-events: auto;
            background: rgba(10, 8, 18, 0.88);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 14px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(10px);
        }

        .brand-title {
            font-size: 11px;
            font-weight: 900;
            color: #ffd700;
            letter-spacing: 0.5px;
        }

        .server-badge {
            background: rgba(56, 189, 248, 0.2);
            color: #38bdf8;
            font-size: 9px;
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid rgba(56, 189, 248, 0.4);
        }

        /* মাঝখানের সিগন্যাল ডিসপ্লে এরিয়া (মডুলার কার্ড) */
        .middle-display-area {
            pointer-events: auto;
            width: 100%;
            max-width: 380px;
            margin: 0 auto;
            background: linear-gradient(145deg, rgba(18, 10, 30, 0.92), rgba(6, 4, 12, 0.95));
            border: 2px solid #ff4b2b;
            border-radius: 18px;
            padding: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        .graph-box {
            position: relative;
            background: radial-gradient(circle, rgba(40, 10, 50, 0.9) 0%, rgba(5, 2, 15, 0.98) 100%);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 12px;
            padding: 16px 10px;
            text-align: center;
            margin-bottom: 10px;
        }

        .prediction-display {
            font-family: 'Orbitron', sans-serif;
            font-size: 38px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
            margin: 4px 0;
        }

        .btn-action {
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: #fff;
            font-weight: 900;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 5px 18px rgba(255, 75, 43, 0.5);
            letter-spacing: 1px;
        }

        /* একদম নিচের কাস্টম নেভিগেশন বার (স্ক্রিনশটের স্টাইলে বাঁধানো) */
        .bottom-nav-bar {
            pointer-events: auto;
            width: 100%;
            background: rgba(10, 8, 18, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 8px 10px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            backdrop-filter: blur(12px);
        }

        .nav-tab {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-tab.active {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 75, 43, 0.4);
        }

        .nav-tab-title {
            font-size: 10px;
            font-weight: 900;
            color: #fff;
        }

        .nav-tab-sub {
            font-size: 8px;
            color: #cbd5e1;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- ১. ব্যাকগ্রাউন্ড ফুল স্ক্রিন গেম ফ্রেম -->
        <iframe class="game-frame" src="https://hgnice.bet/#/register?invitationCode=68758106622"></iframe>

        <!-- ২. ভিআইপি পাসওয়ার্ড প্রটেকশন স্ক্রিন -->
        <div class="auth-overlay" id="authOverlay">
            <div class="auth-card">
                <div style="font-size: 32px; margin-bottom: 10px;">👑</div>
                <div style="font-size: 14px; font-weight: 900; color: #ffd700;">SIDDIK OFFICIAL ORIGINAL AI HACK</div>
                <div style="font-size: 11px; color: #94a3b8; margin-top: 4px;">ফুল-স্ক্রিন ভিআইপি সিস্টেম আনলক করুন</div>
                <input type="password" id="passInput" class="auth-input" placeholder="পাসওয়ার্ড দিন (siddik58)">
                <button class="btn-action" onclick="unlockApp()">🔓 UNLOCK FULL-SCREEN</button>
                <p id="errText" style="color: #ff4d4d; font-size: 11px; font-weight: 700; margin-top: 10px; display: none;">❌ ভুল পাসওয়ার্ড!</p>
            </div>
        </div>

        <!-- ৩. ফুল-স্ক্রিন কাস্টমাইজড হ্যাক ইউজার ইন্টারফেস -->
        <div class="hack-overlay-ui" id="hackUI" style="display: none;">
            
            <!-- টপ বার -->
            <div class="top-custom-bar">
                <div class="brand-title">👑 SIDDIK AI HACK</div>
                <div class="server-badge" id="serverBadge">AVIATOR RADAR ACTIVE</div>
            </div>

            <!-- মাঝখানের প্রেডিকশন ডিসপ্লে বক্স -->
            <div class="middle-display-area">
                
                <!-- Aviator View -->
                <div id="viewAviator">
                    <div class="graph-box">
                        <div style="font-size: 9px; color: #ffd700; font-weight: 800; margin-bottom: 4px;">✨ CASHOUT LOCKED</div>
                        <div class="prediction-display" id="aviatorVal">2.10x</div>
                        <div style="font-size: 10px; color: #38bdf8; font-weight: 700;">AUTO CASHOUT @ 2.10X</div>
                    </div>
                </div>

                <!-- WinGo View -->
                <div id="viewWingo" style="display: none;">
                    <div class="graph-box">
                        <div style="font-size: 9px; color: #38bdf8; font-weight: 800; margin-bottom: 4px;" id="wingoPeriod">PERIOD #2026111201</div>
                        <div class="prediction-display" id="wingoSize" style="color: #facc15;">BIG</div>
                        <div style="font-size: 10px; color: #4ade80; font-weight: 700;" id="wingoColor">WINNER: GREEN (7)</div>
                    </div>
                </div>

                <button class="btn-action" id="signalBtn" onclick="generateSignal()">⚡ GET SIGNAL ⚡</button>
            </div>

            <!-- ৪. একদম নিচের কাস্টম নেভিগেশন বার (স্ক্রিনশটের মতো সাজানো) -->
            <div class="bottom-nav-bar">
                <div class="nav-tab" id="tabWingo" onclick="switchGameMode('wingo')">
                    <div class="nav-tab-title">📊 WINGO 3...</div>
                    <div class="nav-tab-sub">SIZE + 2 NOS</div>
                </div>
                <div class="nav-tab active" id="tabAviator" onclick="switchGameMode('aviator')">
                    <div class="nav-tab-title">✈️ AVIATOR</div>
                    <div class="nav-tab-sub">CRASH SIGNAL</div>
                </div>
                <div class="nav-tab" id="tabMines" onclick="switchGameMode('mines')">
                    <div class="nav-tab-title">💣 MINES</div>
                    <div class="nav-tab-sub">5/6 SAFE BOX</div>
                </div>
            </div>

        </div>

    </div>

    <script>
        let currentGame = 'aviator';

        function unlockApp() {
            const pass = document.getElementById('passInput').value.trim();
            const err = document.getElementById('errText');
            if (pass === 'siddik58') {
                document.getElementById('authOverlay').style.display = 'none';
                document.getElementById('hackUI').style.display = 'flex';
                updateWingoPeriod();
            } else {
                err.style.display = 'block';
            }
        }

        function switchGameMode(mode) {
            currentGame = mode;
            document.getElementById('tabWingo').classList.remove('active');
            document.getElementById('tabAviator').classList.remove('active');
            document.getElementById('tabMines').classList.remove('active');

            const vA = document.getElementById('viewAviator');
            const vW = document.getElementById('viewWingo');
            const badge = document.getElementById('serverBadge');

            if (mode === 'aviator') {
                document.getElementById('tabAviator').classList.add('active');
                vA.style.display = 'block';
                vW.style.display = 'none';
                badge.innerText = 'AVIATOR RADAR ACTIVE';
            } else if (mode === 'wingo') {
                document.getElementById('tabWingo').classList.add('active');
                vA.style.display = 'none';
                vW.style.display = 'block';
                badge.innerText = 'WINGO MARKET ACTIVE';
                updateWingoPeriod();
            } else {
                document.getElementById('tabMines').classList.add('active');
                vA.style.display = 'none';
                vW.style.display = 'block';
                badge.innerText = 'MINES AI ACTIVE';
            }
        }

        function updateWingoPeriod() {
            const now = new Date();
            const mins = now.getHours() * 60 + now.getMinutes() + 1;
            document.getElementById('wingoPeriod').innerText = `PERIOD #20261112${String(mins).padStart(4, '0')}`;
        }

        function generateSignal() {
            const btn = document.getElementById('signalBtn');
            btn.disabled = true;
            btn.innerText = '⏳ ANALYZING MARKET...';

            setTimeout(() => {
                if (currentGame === 'aviator') {
                    const mult = (Math.random() * (4.50 - 1.35) + 1.35).toFixed(2);
                    document.getElementById('aviatorVal').innerText = `${mult}x`;
                } else {
                    updateWingoPeriod();
                    const num = Math.floor(Math.random() * 10);
                    const isBig = num >= 5;
                    const color = [1, 3, 5, 7, 9].includes(num) ? 'GREEN' : 'RED';
                    document.getElementById('wingoSize').innerText = isBig ? 'BIG' : 'SMALL';
                    document.getElementById('wingoSize').style.color = isBig ? '#facc15' : '#38bdf8';
                    document.getElementById('wingoColor').innerText = `WINNER: ${color} (${num})`;
                }
                btn.disabled = false;
                btn.innerText = '⚡ GET SIGNAL ⚡';
            }, 1000);
        }
    </script>
</body>
</html>
