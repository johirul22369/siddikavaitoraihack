<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIDDIK OFFICIAL ORIGINAL AI HACK</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Hind+Siliguri:wght@600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Hind Siliguri', 'Montserrat', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        /* ব্যাকগ্রাউন্ড গেম ফ্রেম (রেফারেল লিংক) */
        .game-frame {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* ফ্লোটিং ড্র্যাগেবল আইকন */
        .floating-icon {
            position: fixed;
            top: 100px;
            right: 20px;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 3px solid #ffd700;
            background: #000;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.9);
            z-index: 9999;
            cursor: pointer;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            user-select: none;
        }

        .floating-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        /* পপআপ মডাল বক্স (স্ক্রিনশটের হুবহু স্টাইল)[span_3](start_span)[span_3](end_span) */
        .overlay-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 92%;
            max-width: 390px;
            background: linear-gradient(145deg, rgba(15, 10, 30, 0.98), rgba(5, 2, 15, 0.99));
            border: 2px solid #38bdf8;
            border-radius: 18px;
            box-shadow: 0 0 45px rgba(56, 189, 248, 0.4), inset 0 0 15px rgba(255, 215, 0, 0.1);
            backdrop-filter: blur(15px);
            z-index: 10000;
            padding: 16px;
            color: #fff;
            text-align: center;
        }

        /* পপআপের ভেতরের টপ র‍্যাডার বার[span_4](start_span)[span_4](end_span) */
        .radar-top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 10px;
            padding: 6px 10px;
            margin-bottom: 12px;
            font-size: 10px;
            font-weight: 900;
        }

        .radar-title {
            color: #ffd700;
            letter-spacing: 0.5px;
        }

        .radar-badge {
            background: rgba(56, 189, 248, 0.2);
            color: #38bdf8;
            padding: 2px 6px;
            border-radius: 5px;
            font-size: 9px;
            border: 1px solid rgba(56, 189, 248, 0.4);
        }

        .close-btn {
            background: none;
            border: none;
            color: #ff4d4d;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        /* সাব হেডার[span_5](start_span)[span_5](end_span) */
        .sub-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 11px;
            font-weight: 700;
            color: #cbd5e1;
            padding: 0 4px;
        }

        .safe-tag {
            color: #4ade80;
            background: rgba(74, 222, 128, 0.15);
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid rgba(74, 222, 128, 0.3);
        }

        /* পাসওয়ার্ড স্ক্রিন */
        .auth-screen {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 15px 5px;
        }

        .auth-desc {
            font-size: 13px;
            color: #ffd700;
            font-weight: 700;
        }

        .input-box {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 2px solid rgba(255, 215, 0, 0.4);
            background: rgba(0, 0, 0, 0.7);
            color: #ffd700;
            text-align: center;
            font-size: 16px;
            font-weight: 800;
            outline: none;
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: #fff;
            font-weight: 900;
            font-size: 15px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 5px 20px rgba(255, 75, 43, 0.5);
            letter-spacing: 1px;
        }

        /* প্রেডিকশন ড্যাশবোর্ড ও এনালাইজিং গ্রাফ[span_6](start_span)[span_6](end_span) */
        .dashboard-screen {
            display: none;
            flex-direction: column;
            gap: 12px;
        }

        .graph-box {
            position: relative;
            background: radial-gradient(circle, rgba(30, 10, 60, 0.9) 0%, rgba(5, 2, 15, 0.98) 100%);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 14px;
            padding: 20px 10px;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            text-align: center;
        }

        .graph-line {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: linear-gradient(to top, rgba(255, 75, 43, 0.2), transparent);
            clip-path: polygon(0 100%, 10% 80%, 30% 70%, 50% 50%, 75% 30%, 100% 5%, 100% 100%);
        }

        .cashout-locked {
            display: inline-block;
            background: rgba(255, 215, 0, 0.15);
            color: #ffd700;
            border: 1px solid rgba(255, 215, 0, 0.4);
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .prediction-display {
            font-size: 40px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
            margin-bottom: 4px;
            position: relative;
            z-index: 2;
        }

        .auto-cashout-text {
            font-size: 11px;
            color: #38bdf8;
            font-weight: 700;
            position: relative;
            z-index: 2;
        }
    </style>
</head>
<body>

    <!-- ১. ব্যাকগ্রাউন্ড গেম ফ্রেম (রেফারেল লিংক) -->
    <iframe class="game-frame" src="https://hgnice.bet/#/register?invitationCode=68758106622"></iframe>

    <!-- ২. ফ্লোটিং আইকন -->
    <div class="floating-icon" id="dragIcon">
        <img src="https://cdn.imageurlgenerator.com/uploads/3420d277-7bc7-4882-aa5e-11d91ee5e9e8.jpg" alt="Icon">
    </div>

    <!-- ৩. পপআপ মডাল window[span_7](start_span)[span_7](end_span) -->
    <div class="overlay-modal" id="overlayModal">
        
        <div class="radar-top-bar">
            <span class="radar-title">SIDDIK AI HACK</span>
            <span class="radar-badge">CRASH RADAR</span>
            <button class="close-btn" onclick="toggleModal()">&times;</button>
        </div>

        <!-- সিকিউরিটি পাসওয়ার্ড স্ক্রিন (siddik58) -->
        <div class="auth-screen" id="authScreen">
            <div class="auth-desc">🔒 ভিআইপি পাসওয়ার্ড দিন</div>
            <input type="password" id="passInput" class="input-box" placeholder="পাসওয়ার্ড লিখুন">
            <button class="btn-action" onclick="verifyPassword()">UNLOCK HACK</button>
            <p id="errorMsg" style="color: #ff4d4d; font-size: 11px; font-weight: 700; display: none;">❌ ভুল পাসওয়ার্ড!</p>
        </div>

        <!-- এআই এনালাইজিং ও প্রেডিকশন ড্যাশবোর্ড[span_8](start_span)[span_8](end_span) -->
        <div class="dashboard-screen" id="dashScreen">
            <div class="sub-header">
                <span>SPRIBE AVIATOR AI #2</span>
                <span class="safe-tag">🛡️ 96.2% SAFE</span>
            </div>

            <div class="graph-box">
                <div class="graph-line"></div>
                <div class="cashout-locked">🔒 CASHOUT LOCKED</div>
                <div class="prediction-display" id="predResult">2.10x</div>
                <div class="auto-cashout-text" id="autoText">AUTO CASHOUT @ 2.10X</div>
            </div>

            <button class="btn-action" id="signalBtn" onclick="getSignal()">⚡ GET SIGNAL ⚡</button>
        </div>
    </div>

    <script>
        let modal = document.getElementById('overlayModal');

        function toggleModal() {
            modal.style.display = (modal.style.display === 'block') ? 'none' : 'block';
        }

        // পাসওয়ার্ড ভেরিফিকেশন (siddik58)
        function verifyPassword() {
            let input = document.getElementById('passInput').value;
            let errorMsg = document.getElementById('errorMsg');

            if (input === 'siddik58') {
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('dashScreen').style.display = 'flex';
                errorMsg.style.display = 'none';
            } else {
                errorMsg.style.display = 'block';
            }
        }

        // এআই এনালাইজিং এবং সিগন্যাল জেনারেটর
        function getSignal() {
            let predResult = document.getElementById('predResult');
            let autoText = document.getElementById('autoText');
            let btn = document.getElementById('signalBtn');

            btn.disabled = true;
            btn.innerText = "ANALYZING...";
            predResult.innerText = "---";
            autoText.innerText = "AI SCANNING GAME DATA...";

            setTimeout(() => {
                let targetVal = (Math.random() * (5.00 - 1.35) + 1.35).toFixed(2);
                predResult.innerText = targetVal + "x";
                autoText.innerText = "AUTO CASHOUT @ " + targetVal + "X";
                btn.innerText = "⚡ GET SIGNAL ⚡";
                btn.disabled = false;
            }, 1200);
        }

        // স্মুথ ড্র্যাগ-এন্ড-ড্রপ
        const dragIcon = document.getElementById('dragIcon');
        let isDragging = false, initialX, initialY;

        dragIcon.addEventListener('touchstart', dragStart, {passive: false});
        dragIcon.addEventListener('touchend', dragEnd, {passive: false});
        dragIcon.addEventListener('touchmove', drag, {passive: false});

        dragIcon.addEventListener('mousedown', dragStart);
        window.addEventListener('mouseup', dragEnd);
        window.addEventListener('mousemove', drag);

        function dragStart(e) {
            isDragging = true;
            let clientX = e.type === "touchstart" ? e.touches[0].clientX : e.clientX;
            let clientY = e.type === "touchstart" ? e.touches[0].clientY : e.clientY;

            initialX = clientX - dragIcon.offsetLeft;
            initialY = clientY - dragIcon.offsetTop;
        }

        function dragEnd() {
            isDragging = false;
        }

        function drag(e) {
            if (!isDragging) return;
            e.preventDefault();

            let clientX = e.type === "touchmove" ? e.touches[0].clientX : e.clientX;
            let clientY = e.type === "touchmove" ? e.touches[0].clientY : e.clientY;

            let x = clientX - initialX;
            let y = clientY - initialY;

            let maxX = window.innerWidth - dragIcon.offsetWidth;
            let maxY = window.innerHeight - dragIcon.offsetHeight;

            x = Math.max(0, Math.min(x, maxX));
            y = Math.max(0, Math.min(y, maxY));

            dragIcon.style.left = x + "px";
            dragIcon.style.top = y + "px";
            dragIcon.style.position = 'fixed';
        }

        let clickTime = 0;
        dragIcon.addEventListener('mousedown', () => clickTime = Date.now());
        dragIcon.addEventListener('touchstart', () => clickTime = Date.now());
        
        dragIcon.addEventListener('mouseup', (e) => {
            if (Date.now() - clickTime < 200) toggleModal();
        });
        dragIcon.addEventListener('touchend', (e) => {
            if (Date.now() - clickTime < 200) toggleModal();
        });
    </script>
</body>
</html>
