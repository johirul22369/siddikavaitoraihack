<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIDDIK OFFICIAL ORIGINAL AI HACK</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Montserrat:wght@600;700;800;900&family=Hind+Siliguri:wght@600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', 'Hind Siliguri', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            background: #030408;
            color: #fff;
            overflow: hidden;
        }

        /* ফুল-স্ক্রিন অ্যাপ শেল */
        .app-shell {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* ব্যাকগ্রাউন্ড গেম ফ্রেম */
        .game-frame {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* ভিআইপি লগইন ওভারলে (পাসওয়ার্ড বক্স সম্পূর্ণ খালি থাকবে) */
        .login-view {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, #150c30 0%, #030307 100%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }

        .login-card {
            width: 100%;
            max-width: 370px;
            background: rgba(14, 11, 25, 0.95);
            border: 2px solid #ffd700;
            border-radius: 22px;
            padding: 30px 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.95), 0 0 35px rgba(255, 215, 0, 0.2);
        }

        .login-title {
            font-size: 14px;
            font-weight: 900;
            color: #ffd700;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .login-sub {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .pass-input {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: 2px solid #ffd700;
            background: #000;
            color: #ffd700;
            font-size: 16px;
            font-weight: 800;
            text-align: center;
            outline: none;
            margin-bottom: 14px;
        }

        .pass-input::placeholder {
            color: rgba(255, 215, 0, 0.35);
            font-size: 13px;
        }

        .primary-btn {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
            color: #fff;
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 75, 43, 0.45);
            transition: transform 0.1s;
        }

        .primary-btn:active {
            transform: scale(0.97);
        }

        /* ফুল-স্ক্রিন হ্যাক ওভারলে ইউআই */
        .hack-ui-container {
            position: absolute;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px;
        }

        /* টপ কাস্টম বার */
        .top-custom-bar {
            pointer-events: auto;
            background: rgba(10, 8, 18, 0.9);
            border: 1px solid rgba(255, 215, 0, 0.35);
            border-radius: 14px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(12px);
        }

        .brand-name {
            font-size: 11px;
            font-weight: 900;
            color: #ffd700;
            letter-spacing: 0.5px;
        }

        .server-status {
            background: rgba(56, 189, 248, 0.2);
            color: #38bdf8;
            font-size: 9px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid rgba(56, 189, 248, 0.4);
        }

        /* মাঝখানের সিগন্যাল বক্স */
        .middle-box {
            pointer-events: auto;
            width: 100%;
            max-width: 380px;
            margin: 0 auto;
            background: linear-gradient(145deg, rgba(16, 10, 28, 0.94), rgba(5, 3, 10, 0.96));
            border: 2px solid #ff4b2b;
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.85);
        }

        .display-screen {
            position: relative;
            background: radial-gradient(circle, rgba(40, 10, 50, 0.9) 0%, rgba(5, 2, 15, 0.98) 100%);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 14px;
            padding: 18px 10px;
            text-align: center;
            margin-bottom: 12px;
        }

        .main-val {
            font-family: 'Orbitron', sans-serif;
            font-size: 40px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 22px rgba(255, 215, 0, 0.8);
            margin: 4px 0;
        }

        /* একদম নিচের কাস্টম নেভিগেশন বার (স্ক্রিনশটের স্টাইলে সাজানো) */
        .bottom-nav-bar {
            pointer-events: auto;
            width: 100%;
            background: rgba(10, 8, 18, 0.96);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 8px 10px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            backdrop-filter: blur(14px);
        }

        .nav-tab {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-tab.active {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 75, 43, 0.5);
        }

        .nav-title {
            font-size: 10px;
            font-weight: 900;
            color: #fff;
        }

        .nav-sub {
            font-size: 8px;
            color: #cbd5e1;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <div class="app-shell">
        
        <!-- ব্যাকগ্রাউন্ড গেম ফ্রেম -->
        <iframe class="game-frame" src="https://hgnice.bet/#/register?invitationCode=68758106622"></iframe>

        <!-- ভিআইপি লগইন স্ক্রিন (খালি পাসওয়ার্ড বক্স) -->
        <div class="login-view" id="loginView">
            <div class="login-card">
                <div style="font-size: 34px; margin-bottom: 8px;">👑</div>
                <div class="login-title">SIDDIK OFFICIAL ORIGINAL AI HACK</div>
                <div class="login-sub">পাসওয়ার্ড দিয়ে ভিআইপি সিস্টেম আনলক করুন</div>
                <input type="password" id="passInput" class="pass-input" placeholder="Enter VIP Password..." autocomplete="off">
                <button class="primary-btn" onclick="verifyLogin()">🔓 UNLOCK SYSTEM</button>
                <p id="errText" style="color: #ff4d4d; font-size: 11px; font-weight: 700; margin-top: 10px; display: none;">❌ ভুল পাসওয়ার্ড!</p>
            </div>
        </div>

        <!-- ফুল-স্ক্রিন কাস্টমাইজড অ্যাপ ইউআই -->
        <div class="hack-ui-container" id="hackUI" style="display: none;">
            
            <!-- টপ বার -->
            <div class="top-custom-bar">
                <div class="brand-name">👑 SIDDIK AI HACK</div>
                <div class="server-status" id="serverBadge">AVIATOR RADAR ACTIVE</div>
            </div>

            <!-- মাঝখানের ডিসপ্লে -->
            <div class="middle-box">
                <div id="viewAviator">
                    <div class="display-screen">
                        <div style="font-size: 9px; color: #ffd700; font-weight: 800; margin-bottom: 4px;">✨ CASHOUT LOCKED</div>
                        <div class="main-val" id="aviatorVal">2.10x</div>
                        <div style="font-size: 10px; color: #38bdf8; font-weight: 700;">AUTO CASHOUT @ 2.10X</div>
                    </div>
                </div>

                <div id="viewWingo" style="display: none;">
                    <div class="display-screen">
                        <div style="font-size: 9px; color: #38bdf8; font-weight: 800; margin-bottom: 4px;" id="wingoPeriod">PERIOD #2026111201</div>
                        <div class="main-val" id="wingoSize" style="color: #facc15;">BIG</div>
                        <div style="font-size: 10px; color: #4ade80; font-weight: 700;" id="wingoColor">WINNER: GREEN (7)</div>
                    </div>
                </div>

                <button class="primary-btn" id="signalBtn" onclick="generateSignal()">⚡ GET SIGNAL ⚡</button>
            </div>

            <!-- নিচের নেভিগেশন বার -->
            <div class="bottom-nav-bar">
                <div class="nav-tab" id="tabWingo" onclick="switchMode('wingo')">
                    <div class="nav-title">📊 WINGO 3...</div>
                    <div class="nav-sub">SIZE + 2 NOS</div>
                </div>
                <div class="nav-tab active" id="tabAviator" onclick="switchMode('aviator')">
                    <div class="nav-title">✈️ AVIATOR</div>
                    <div class="nav-sub">CRASH SIGNAL</div>
                </div>
                <div class="nav-tab" id="tabMines" onclick="switchMode('mines')">
                    <div class="nav-title">💣 MINES</div>
                    <div class="nav-sub">5/6 SAFE BOX</div>
                </div>
            </div>

        </div>

    </div>

    <script>
        let currentMode = 'aviator';

        function verifyLogin() {
            const pass = document.getElementById('passInput').value.trim();
            const err = document.getElementById('errText');
            if (pass === 'siddik58') {
                document.getElementById('loginView').style.display = 'none';
                document.getElementById('hackUI').style.display = 'flex';
                updatePeriod();
            } else {
                err.style.display = 'block';
            }
        }

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('tabWingo').classList.remove('active');
            document.getElementById('tabAviator').classList.remove('active');
            document.getElementById('tabMines').classList.remove('active');

            const vA = document.getElementById('viewAviator');
            const vW = document.getElementById('viewWingo');
            const badge = document.getElementById('serverBadge');

            if (mode === 'aviator') {
                document.getElementById('tabAviator').classList.add('active');
                vA.style.display = 'block';
                vW.style.display = 'none';
                badge.innerText = 'AVIATOR RADAR ACTIVE';
            } else if (mode === 'wingo') {
                document.getElementById('tabWingo').classList.add('active');
                vA.style.display = 'none';
                vW.style.display = 'block';
                badge.innerText = 'WINGO MARKET ACTIVE';
                updatePeriod();
            } else {
                document.getElementById('tabMines').classList.add('active');
                vA.style.display = 'none';
                vW.style.display = 'block';
                badge.innerText = 'MINES AI ACTIVE';
            }
        }

        function updatePeriod() {
            const now = new Date();
            const mins = now.getHours() * 60 + now.getMinutes() + 1;
            document.getElementById('wingoPeriod').innerText = `PERIOD #20261112${String(mins).padStart(4, '0')}`;
        }

        function generateSignal() {
            const btn = document.getElementById('signalBtn');
            btn.disabled = true;
            btn.innerText = '⏳ ANALYZING MARKET...';

            setTimeout(() => {
                if (currentMode === 'aviator') {
                    const mult = (Math.random() * (4.50 - 1.35) + 1.35).toFixed(2);
                    document.getElementById('aviatorVal').innerText = `${mult}x`;
                } else {
                    updatePeriod();
                    const num = Math.floor(Math.random() * 10);
                    const isBig = num >= 5;
                    const color = [1, 3, 5, 7, 9].includes(num) ? 'GREEN' : 'RED';
                    document.getElementById('wingoSize').innerText = isBig ? 'BIG' : 'SMALL';
                    document.getElementById('wingoSize').style.color = isBig ? '#facc15' : '#38bdf8';
                    document.getElementById('wingoColor').innerText = `WINNER: ${color} (${num})`;
                }
                btn.disabled = false;
                btn.innerText = '⚡ GET SIGNAL ⚡';
            }, 1000);
        }
    </script>
</body>
</html>
